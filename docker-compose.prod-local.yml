# Docker Compose for ChatTutor Production Build (Local)
# Run with: docker compose -f docker-compose.prod-local.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: chattutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chattutor
      POSTGRES_USER: chattutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - chattutor_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattutor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chattutor

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: chattutor-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://chattutor:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/chattutor
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4}
      PAINTER_MODEL: ${PAINTER_MODEL:-}
      PROGRAMMER_MODEL: ${PROGRAMMER_MODEL:-}
      TITLE_MODEL: ${TITLE_MODEL:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      NODE_ENV: production
      SKIP_DB_INIT: ${SKIP_DB_INIT:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    networks:
      - chattutor

volumes:
  chattutor_postgres:
    driver: local

networks:
  chattutor:
    driver: bridge
